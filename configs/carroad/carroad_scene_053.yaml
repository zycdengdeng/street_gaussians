# Car-Road Scene 053 (053_car0402_road0402_t31) - Street Gaussians Training
#
# Preprocess first:
#   python script/carroad/prepare_carroad_data.py \
#       --raw_dir /mnt/car_road_data_TianJin/053_car0402_road0402_t31 \
#       --output_dir ./data/carroad/scene_053 \
#       --calib_override /mnt/car_road_data_TianJin/support_info/calib.json \
#       --cameras pinhole0 pinhole1 pinhole2 pinhole3 \
#       --frame_step 3
#
# Train:
#   python train.py --config configs/carroad/carroad_scene_053.yaml

task: carroad_exp
source_path: ./data/carroad/scene_053
exp_name: carroad_scene_053
to_cuda: true

data:
  split_test: -1
  split_train: 1
  type: CarRoad
  white_background: false
  selected_frames: [0, -1]
  cameras: [0, 1, 2, 3]
  extent: 100
  use_colmap: false
  filter_colmap: false
  box_scale: 1.5
  # voxel_size: auto  # set explicitly (e.g. 0.5) to override auto-scaling

model:
  gaussian:
    sh_degree: 1
    fourier_dim: 5
    fourier_scale: 1.
    flip_prob: 0.2
  nsg:
    include_bkgd: true
    include_obj: true
    include_sky: false
    opt_track: true
  sky:
    resolution: 1024
    white_background: false

train:
  iterations: 30000
  test_iterations: [7000, 15000, 30000]
  save_iterations: [30000]
  checkpoint_iterations: [30000]

optim:
  prune_box_interval: 100
  densification_interval: 100
  densify_from_iter: 500
  densify_grad_threshold_bkgd: 0.0006
  densify_grad_abs_bkgd: true
  densify_grad_threshold_obj: 0.0002
  densify_grad_abs_obj: false
  densify_grad_threshold: 0.0002
  densify_until_iter: 20000
  feature_lr: 0.0025
  max_screen_size: 20
  min_opacity: 0.005
  opacity_lr: 0.05
  opacity_reset_interval: 3000
  percent_big_ws: 0.1
  percent_dense: 0.01
  position_lr_delay_mult: 0.01
  position_lr_final: 1.6e-06
  position_lr_init: 0.00016
  position_lr_max_steps: 30000
  rotation_lr: 0.001
  scaling_lr: 0.005
  semantic_lr: 0.01
  lambda_dssim: 0.2
  lambda_sky: 0.0
  lambda_sky_scale: []
  lambda_mask: 0.1
  lambda_reg: 0.1
  lambda_depth_lidar: 0.1
  track_position_lr_delay_mult: 0.01
  track_position_lr_init: 0.005
  track_position_lr_final: 5.0e-5
  track_position_max_steps: 30000
  track_rotation_lr_delay_mult: 0.01
  track_rotation_lr_init: 0.001
  track_rotation_lr_final: 1.0e-5
  track_rotation_max_steps: 30000

render:
  fps: 10
  concat_cameras: [0, 1, 2, 3]
